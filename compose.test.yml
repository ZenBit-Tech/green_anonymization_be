name: green-anonymization-be-testing

services:
  ollama:
    container_name: ollama_testing
    image: ollama/ollama:latest
    ports:
      - '127.0.0.1:${OLLAMA_PORT}:11434'
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  presidio-anonymizer:
    container_name: presidio_anonymizer_testing
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - 127.0.0.1:${PRESIDIO_ANONYMIZER_PORT}:3000

  presidio-analyzer:
    container_name: presidio_analyzer_testing
    image: mcr.microsoft.com/presidio-analyzer:latest
    environment:
      - OLLAMA_HOST=http://ollama:${OLLAMA_PORT}
    ports:
      - 127.0.0.1:${PRESIDIO_ANALYZER_PORT}:3000
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-data:
  database_data:
